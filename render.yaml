services:
  - type: web
    name: web-chess
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --worker-class gthread --threads 100 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
